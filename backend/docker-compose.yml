services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=energy-monitor
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - ./influxdb3/data:/var/lib/influxdb3/data
    networks:
      - iot-network

  backend:
    build: .
    container_name: flask-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TRUST_CADDY_PROXY: "1"
    depends_on:
      - influxdb
    networks:
      - iot-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD com uma senha forte}
    networks:
      - iot-network

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN}
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./firmware:/srv/firmware:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - grafana
    networks:
      - iot-network

volumes:
  grafana-data:
  caddy-data:
  caddy-config:

networks:
  iot-network:
    driver: bridge
